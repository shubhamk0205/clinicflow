# Values for prometheus-community/kube-prometheus-stack (Prometheus + Grafana)
# helm install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
#   -n monitoring --create-namespace -f monitoring/prometheus-values.yaml
prometheus:
  prometheusSpec:
    # Scrape ServiceMonitors from every namespace, not only ones created by this release
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    serviceMonitorSelector: {}

grafana:
  enabled: true
  adminPassword: change-me   # override with --set grafana.adminPassword=...
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL      # load the ClinicFlow dashboard ConfigMap from the clinicflow namespace
