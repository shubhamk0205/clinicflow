name: ClinicFlow CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/shubhamk0205/clinicflow-backend
  FRONTEND_IMAGE: ghcr.io/shubhamk0205/clinicflow-frontend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Run backend tests (fails the build on any failure)
        working-directory: backend
        run: pytest

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

  build-scan-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Build images (tagged with the commit SHA)
        run: |
          docker build -t $BACKEND_IMAGE:${{ github.sha }} ./backend
          docker build -t $FRONTEND_IMAGE:${{ github.sha }} ./frontend

      - name: Trivy scan backend image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Trivy scan frontend image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push images to GHCR
        if: github.event_name == 'push'
        run: |
          docker push $BACKEND_IMAGE:${{ github.sha }}
          docker push $FRONTEND_IMAGE:${{ github.sha }}

  deploy:
    # Runs only on main, and only when the repo variable DEPLOY_ENABLED=true
    # (set it while the EKS cluster exists; unset it after terraform destroy).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: build-scan-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Configure kubectl for EKS
        run: aws eks update-kubeconfig --region ap-southeast-2 --name clinicflow-eks

      - uses: azure/setup-helm@v4

      - name: Deploy with Helm
        run: |
          helm upgrade --install clinicflow ./helm/clinicflow \
            --namespace clinicflow --create-namespace \
            -f helm/clinicflow/values-prod.yaml \
            --set backend.image=$BACKEND_IMAGE \
            --set backend.tag=${{ github.sha }} \
            --set frontend.image=$FRONTEND_IMAGE \
            --set frontend.tag=${{ github.sha }} \
            --wait --timeout 5m
