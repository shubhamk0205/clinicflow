{{- if .Values.monitoring.grafanaDashboard.enabled }}
# Picked up automatically by the Grafana sidecar in kube-prometheus-stack (label grafana_dashboard=1)
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "clinicflow.name" . }}-grafana-dashboard
  labels:
    grafana_dashboard: "1"
    {{- include "clinicflow.labels" . | nindent 4 }}
data:
  clinicflow.json: |-
{{ .Files.Get "dashboards/clinicflow.json" | indent 4 }}
{{- end }}
